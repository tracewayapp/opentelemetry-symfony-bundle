name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / DBAL ${{ matrix.dbal }}${{ matrix.prefer_lowest && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    env:
      # Symfony's recommendation for bundle CI: zero tolerance for direct use
      # of deprecated Symfony APIs. Our phpunit.dist.xml separately enforces
      # max[self]=0 (self-deprecations only inside @group legacy via the
      # symfony/phpunit-bridge bootstrap).
      SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported combo with --prefer-lowest --prefer-stable so the
          # dependency floor declared in composer.json (open-telemetry/api ^1.0,
          # symfony/config ^6.4, etc.) is actually exercised.
          - php: '8.1'
            symfony: '6.4.*'
            dbal: '^4.0'
            phpunit: '^10.0'
            prefer_lowest: true
            coverage: false
          - php: '8.2'
            symfony: '7.4.*'
            dbal: '^4.0'
            phpunit: '^11.0'
            coverage: true
          - php: '8.2'
            symfony: '7.4.*'
            dbal: '^3.6'
            phpunit: '^11.0'
            coverage: false
          # Most-used current stable PHP version per Packagist stats.
          - php: '8.3'
            symfony: '7.4.*'
            dbal: '^4.0'
            phpunit: '^11.0'
            coverage: false
          - php: '8.4'
            symfony: '8.0.*'
            dbal: '^4.0'
            phpunit: '^13.0'
            coverage: false
          # Catch native PHP deprecations (e.g. SplObjectStorage::contains/detach
          # deprecated in 8.5) before users hit them. --fail-on-deprecation makes
          # PHPUnit exit non-zero on any E_USER_DEPRECATED; the symfony/phpunit-bridge
          # bootstrap converts native E_DEPRECATED into the same channel.
          - php: '8.5'
            symfony: '8.0.*'
            dbal: '^4.0'
            phpunit: '^13.0'
            coverage: false
            fail_on_deprecation: true
          # Latest stable Symfony minor.
          - php: '8.5'
            symfony: '8.1.*'
            dbal: '^4.0'
            phpunit: '^13.0'
            coverage: false
            fail_on_deprecation: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Restrict Symfony version
        run: |
          composer require --no-update symfony/config:${{ matrix.symfony }}
          composer require --no-update symfony/dependency-injection:${{ matrix.symfony }}
          composer require --no-update symfony/event-dispatcher:${{ matrix.symfony }}
          composer require --no-update symfony/http-foundation:${{ matrix.symfony }}
          composer require --no-update symfony/http-kernel:${{ matrix.symfony }}
          composer require --no-update symfony/yaml:${{ matrix.symfony }}

      - name: Restrict DBAL version
        run: composer require --no-update --dev doctrine/dbal:${{ matrix.dbal }}

      - name: Pin PHPUnit version
        run: composer require --no-update --dev phpunit/phpunit:${{ matrix.phpunit }}

      - name: Install dependencies (lowest)
        if: ${{ matrix.prefer_lowest }}
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist

      - name: Install dependencies
        if: ${{ !matrix.prefer_lowest }}
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit ${{ matrix.fail_on_deprecation && '--fail-on-deprecation --fail-on-notice' || '' }}

      - name: Run PHPUnit with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-clover coverage.xml ${{ matrix.fail_on_deprecation && '--fail-on-deprecation --fail-on-notice' || '' }}

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
