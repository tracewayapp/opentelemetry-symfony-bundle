version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # A library: add new majors to a range instead of raising its floor, which
    # would silently drop support for versions users still run.
    versioning-strategy: widen
    groups:
      dev-tooling:
        patterns:
          - phpstan/*
          - php-cs-fixer/*
          - phpunit/*
          - symfony/phpunit-bridge
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
